<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .joke-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            line-height: 1.6;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .joke-box.loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .joke-type {
            display: inline-block;
            background: #f0f0f0;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 200px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            padding: 10px 16px;
            font-size: 14px;
            min-width: auto;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .category-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .category-btn {
            padding: 10px 16px;
            background: #f5f5f5;
            color: #333;
            border: 2px solid transparent;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .category-btn:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .category-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .info-box {
            background: #f0f8ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
            margin: 20px 0;
            color: #333;
            font-size: 14px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-box {
            background: #fee;
            border-left: 4px solid #f44;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .joke-box {
                padding: 20px;
                font-size: 16px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn-primary {
                min-width: auto;
            }

            .category-buttons {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>😂 Joke Generator</h1>
    <p class="subtitle">Get random jokes from multiple categories</p>

    <div class="category-buttons">
        <button class="category-btn active" data-type="any" onclick="selectCategory('any')">Any</button>
        <button class="category-btn" data-type="general" onclick="selectCategory('general')">General</button>
        <button class="category-btn" data-type="programming" onclick="selectCategory('programming')">Programming</button>
        <button class="category-btn" data-type="knock-knock" onclick="selectCategory('knock-knock')">Knock-knock</button>
    </div>

    <div class="joke-type" id="jokeType">Random</div>

    <div class="joke-box" id="jokeBox">
        Click "Get Joke" to start laughing! 🎭
    </div>

    <div class="button-group">
        <button class="btn-primary" onclick="getJoke()">
            <span id="btnText">Get Joke</span>
        </button>
        <button class="btn-secondary" onclick="copyJoke()" title="Copy joke to clipboard">📋</button>
        <button class="btn-secondary" onclick="shareJoke()" title="Share joke">📤</button>
    </div>

    <div id="errorBox"></div>

    <div class="info-box">
        <strong>💡 Tip:</strong> Jokes are loaded from the <strong>JokeAPI</strong>. Select a category or refresh for a new joke each time!
    </div>

    <div class="stats">
        <div class="stat-item">
            <div class="stat-number" id="jokeCount">0</div>
            <div class="stat-label">Jokes Loaded</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="categoryCount">4</div>
            <div class="stat-label">Categories</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="uptime">API</div>
            <div class="stat-label">Status</div>
        </div>
    </div>
</div>

<script>
    let currentJoke = '';
    let jokeCount = 0;
    let selectedCategory = 'any';
    const API_BASE = 'https://v2.jokeapi.dev/joke';

    // Load joke count from localStorage
    function loadStats() {
        const saved = localStorage.getItem('jokeCount');
        if (saved) {
            jokeCount = parseInt(saved);
            document.getElementById('jokeCount').textContent = jokeCount;
        }
    }

    // Save joke count to localStorage
    function saveStats() {
        localStorage.setItem('jokeCount', jokeCount);
        document.getElementById('jokeCount').textContent = jokeCount;
    }

    // Select category
    function selectCategory(category) {
        selectedCategory = category;
        
        // Update button states
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');
        
        // Update type display
        const typeMap = {
            'any': 'Random Category',
            'general': 'General Jokes',
            'programming': 'Programming Jokes',
            'knock-knock': 'Knock-Knock Jokes'
        };
        document.getElementById('jokeType').textContent = typeMap[category];
        
        // Clear error box
        document.getElementById('errorBox').innerHTML = '';
    }

    // Get joke from API
    async function getJoke() {
        const jokeBox = document.getElementById('jokeBox');
        const btnText = document.getElementById('btnText');
        const errorBox = document.getElementById('errorBox');
        
        // Show loading state
        jokeBox.classList.add('loading');
        jokeBox.innerHTML = '<div class="loading-spinner"></div> Loading...';
        btnText.textContent = 'Loading...';
        errorBox.innerHTML = '';
        
        try {
            // Build URL based on selected category
            let url = API_BASE;
            if (selectedCategory !== 'any') {
                url += `/${selectedCategory}`;
            }
            
            // Fetch joke with parameters
            const response = await fetch(url + '?format=json&type=single');
            
            if (!response.ok) {
                throw new Error(`API Error: ${response.status}`);
            }
            
            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.message || 'Failed to fetch joke');
            }
            
            // Extract joke text
            currentJoke = data.joke;
            
            // Display joke
            jokeBox.classList.remove('loading');
            jokeBox.innerHTML = `<div>${currentJoke}</div>`;
            btnText.textContent = 'Get Another Joke';
            
            // Increment counter
            jokeCount++;
            saveStats();
            
        } catch (error) {
            jokeBox.classList.remove('loading');
            jokeBox.innerHTML = '😞 Could not load joke...';
            btnText.textContent = 'Try Again';
            
            // Show error message
            errorBox.innerHTML = `
                <div class="error-box">
                    <strong>Oops!</strong> ${error.message}. Please try again later.
                </div>
            `;
            console.error('Error:', error);
        }
    }

    // Copy joke to clipboard
    function copyJoke() {
        if (!currentJoke) {
            alert('No joke to copy! Get a joke first.');
            return;
        }
        
        navigator.clipboard.writeText(currentJoke).then(() => {
            alert('Joke copied to clipboard! 📋');
        }).catch(err => {
            alert('Failed to copy: ' + err);
        });
    }

    // Share joke
    function shareJoke() {
        if (!currentJoke) {
            alert('No joke to share! Get a joke first.');
            return;
        }
        
        if (navigator.share) {
            navigator.share({
                title: 'Check out this joke!',
                text: currentJoke
            }).catch(err => console.log('Error sharing:', err));
        } else {
            // Fallback for browsers that don't support Web Share API
            const text = encodeURIComponent(currentJoke);
            const url = `https://twitter.com/intent/tweet?text=${text}`;
            window.open(url, '_blank');
        }
    }

    // Initialize on page load
    window.addEventListener('load', () => {
        loadStats();
        // Auto-load a joke on startup
        setTimeout(() => {
            getJoke();
        }, 500);
    });

    // Keyboard shortcut (Space to get new joke)
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
            e.preventDefault();
            getJoke();
        }
    });
</script>

</body>
</html>
